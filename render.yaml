services:
  - type: web
    name: summameta
    env: python
    plan: free          # 512 MB RAM, yeterli
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: RENDER_SECRET
        value: BURAYA_SIFRENIZI_YAZIN   # Android AppModule.kt ile aynı olmalı
      - key: GROQ_API_KEY
        sync: false    # Render dashboard'dan girin
      - key: TOGETHER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MAX_FILE_MB
        value: "20"
      - key: MAX_TOKENS
        value: "2000"
